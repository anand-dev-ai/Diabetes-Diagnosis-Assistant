<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Diabetes Diagnosis Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>🩺 Diabetes Diagnosis Assistant</h1>
    <p class="subtitle">Smart AI-powered prediction tool</p>

    <form id="patient-form" class="form-grid">
      <div class="form-group">
        <label>Pregnancies</label>
        <input type="number" id="pregnancies" required>
      </div>
      <div class="form-group">
        <label>Glucose</label>
        <input type="number" id="glucose" required>
      </div>
      <div class="form-group">
        <label>Blood Pressure</label>
        <input type="number" id="blood_pressure" required>
      </div>
      <div class="form-group">
        <label>Skin Thickness</label>
        <input type="number" id="skin_thickness" required>
      </div>
      <div class="form-group">
        <label>Insulin</label>
        <input type="number" id="insulin" required>
      </div>
      <div class="form-group">
        <label>BMI</label>
        <input type="number" step="0.1" id="bmi" required>
      </div>
      <div class="form-group">
        <label>Diabetes Pedigree Function</label>
        <input type="number" step="0.01" id="dpf" required>
      </div>
      <div class="form-group">
        <label>Age</label>
        <input type="number" id="age" required>
      </div>

      <div class="buttons">
        <button type="submit" class="btn-primary">🔍 Predict</button>
        <button type="button" id="generate-sample" class="btn-secondary">🎲 Generate Sample</button>
      </div>
    </form>

    <div id="result" class="result-box">Result will appear here...</div>
    <div id="progress-bar" class="progress-bar">
      <div id="progress-fill"></div>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
